<!doctype html>
<html lang="en" data-theme="esports"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a11"><meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FF Arena"><meta name="format-detection" content="telephone=no">
<title>FF Arena</title><meta name="description" content="FF Arena: Free Fire player profiles, ranks, challenges and leaderboards.">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="stylesheet" href="/app.css"><link rel="modulepreload" href="/app.js">
<script>try{var t=localStorage.getItem("theme");document.documentElement.dataset.theme=["classic","pink","esports","modern"].indexOf(t)>-1?t:"esports"}catch(e){}</script>
</head><body>
<div id="shell">
<aside class="side" id="side" aria-label="Main"></aside>
<header class="topbar" id="top"><span class="logo"><i>FF</i>ARENA</span></header>
<main class="main" id="app" aria-live="polite"><div class="card"><div class="row"><div class="skel" style="width:64px;height:64px;border-radius:30%"></div><div class="grow"><div class="skel" style="height:18px;width:60%;margin-bottom:10px"></div><div class="skel" style="height:13px;width:40%"></div></div></div></div><div class="card"><div class="skel" style="height:90px"></div></div></main>
<nav class="nav" id="nav" aria-label="Main"></nav>
</div>
<svg id="sprite" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<div id="toasts" role="status" aria-live="polite"></div><div id="modal"></div>
<noscript><div style="padding:24px;font:16px sans-serif">FF Arena needs JavaScript to run.</div></noscript>
<script type="module" src="/app.js"></script>
</body></html>
